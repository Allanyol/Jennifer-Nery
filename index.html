<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Agenda Jennifer Neri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: sistema de uso diário. Barra superior com logo + abas (vira barra inferior no celular); telas Hoje, Agenda, Lembretes, Financeiro, Ajustes */
:root{
  --bg:#0a0806; --bg2:#100c08; --card:#16110b; --line:#33271490; --line2:#4a3a1c;
  --gold:#e6b94a; --gold2:#c9972b; --pale:#f4dc9b; --fg:#f3e9d2; --muted:#a39375;
  --ok:#7fc49a; --warn:#e58a6a; --in:#7fc49a; --out:#e58a6a;
  --display:"Cormorant Garamond",Georgia,serif; --body:"Jost",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px;
  background-image:radial-gradient(ellipse at 50% -10%,rgba(230,185,74,.12),transparent 50%)}
button,input,select,textarea{font:inherit}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,2.8rem);color:var(--pale)}
h2{font-size:1.7rem;color:var(--pale)}
.eyebrow{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
header.top img{height:68px;width:auto;display:block;mix-blend-mode:screen}
nav.tabs{display:flex;gap:4px}
nav.tabs button{background:none;border:0;color:var(--muted);padding:10px 16px;cursor:pointer;letter-spacing:.14em;text-transform:uppercase;font-size:.75rem;border-bottom:2px solid transparent}
nav.tabs button:hover{color:var(--gold)}
nav.tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
@media(max-width:700px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg2);border-top:1px solid var(--line2);justify-content:space-around;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
  nav.tabs button{padding:10px 4px;font-size:.62rem;letter-spacing:.08em;flex:1;border-bottom:0;border-top:2px solid transparent}
  nav.tabs button.on{border-top-color:var(--gold)}
  header.top img{height:56px}
}
main{padding-block:26px}
.page-head{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.page-head p{margin:6px 0 0;color:var(--muted)}

.btn{border:1px solid var(--gold);background:linear-gradient(180deg,#f2cf72,#c9972b);color:#1a1205;padding:10px 18px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:.72rem;cursor:pointer;border-radius:2px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--gold)}
.btn.sm{padding:6px 12px;font-size:.65rem}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.stat{border:1px solid var(--line2);padding:14px 16px;background:var(--card)}
.stat b{display:block;font-family:var(--display);font-size:2rem;font-weight:500;color:var(--pale);line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stat.in b{color:var(--in)} .stat.out b{color:var(--out)}

.bar{height:6px;background:var(--bg2);border:1px solid var(--line2);margin-bottom:18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--pale));transition:width .3s}

.card{background:var(--card);border:1px solid var(--line2);padding:6px 18px}
.sec{margin-bottom:26px}
.sec>h3{font-size:1.25rem;color:var(--gold);margin-bottom:8px;letter-spacing:.04em}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line2)}
.item:last-child{border-bottom:0}
.chk{width:28px;height:28px;border:1.5px solid var(--gold2);background:none;color:#1a1205;cursor:pointer;display:grid;place-items:center;font-size:1rem;padding:0}
.chk.on{background:var(--gold);border-color:var(--gold)}
.item .main{min-width:0}
.item .t{font-size:1.02rem;overflow-wrap:anywhere}
.item .s{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.item .time{font-family:var(--display);font-size:1.25rem;color:var(--pale);margin-right:8px;font-variant-numeric:tabular-nums}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.item .side{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line2);color:var(--muted);padding:2px 7px}
.tag.a{color:var(--gold);border-color:var(--gold2)}
.tag.val{color:var(--in);border-color:var(--in)}
.tag.cancel{color:var(--warn);border-color:var(--warn)}
.ico{background:none;border:1px solid var(--line2);color:var(--muted);width:32px;height:32px;cursor:pointer}
.ico:hover{color:var(--gold);border-color:var(--gold)}
.empty{padding:20px 0;color:var(--muted);font-family:var(--display);font-size:1.2rem;font-style:italic}

/* calendário */
.cal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:820px){.cal{grid-template-columns:minmax(0,1fr)}}
.calbox{background:var(--card);border:1px solid var(--line2);padding:18px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-head h2{text-transform:capitalize}
.g7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-block:4px}
.day{aspect-ratio:1;background:none;border:1px solid transparent;color:var(--fg);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;padding:0}
.day:hover{border-color:var(--gold2)}
.day.out{color:#5c503b}
.day.today{border-color:var(--gold2)}
.day.sel{background:linear-gradient(180deg,#f2cf72,#c9972b);color:#1a1205;font-weight:500}
.day .n{position:absolute;right:3px;top:2px;font-size:.6rem;color:var(--gold);font-weight:500}
.day.sel .n{color:#1a1205}

/* financeiro */
.chart{display:flex;align-items:flex-end;gap:3px;height:140px;padding:10px 0 0;border-bottom:1px solid var(--line2)}
.chart div{flex:1;min-width:0;background:linear-gradient(180deg,var(--pale),var(--gold2));min-height:2px;position:relative}
.chart div.z{background:var(--line2)}
.axis{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:4px}
.closing{border:1px solid var(--gold2);background:linear-gradient(180deg,rgba(230,185,74,.1),transparent);padding:20px;margin-bottom:22px}
.closing .big{font-family:var(--display);font-size:clamp(2.4rem,9vw,3.6rem);color:var(--pale);line-height:1;font-variant-numeric:tabular-nums}
.pos{color:var(--in)} .neg{color:var(--out)}

/* ajustes */
.setrow{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.setrow:last-child{border-bottom:0}
.sw{width:52px;height:30px;border:1px solid var(--gold2);background:var(--bg2);position:relative;cursor:pointer;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;background:var(--muted);transition:left .2s}
.sw.on{background:rgba(230,185,74,.2)}
.sw.on::after{left:25px;background:var(--gold)}

/* alertas */
#alerts{position:sticky;top:0;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:980px;margin:0 auto}
#alerts:not(:empty){padding-block:10px 4px}
#saved:not(:empty){padding-block:10px 0}
.saved{border:1px solid var(--ok);background:#101a13;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.saved span{color:var(--ok)}
.saved a{text-decoration:none}
.al{width:100%;max-width:560px;background:#1d1608;border:1px solid var(--gold);box-shadow:0 8px 30px rgba(0,0,0,.7);padding:12px 14px;display:grid;gap:10px}
.al .m b{display:block;font-family:var(--display);font-size:1.35rem;color:var(--pale);font-weight:500;line-height:1.15}
.al .m span{font-size:.85rem;color:var(--muted)}
.al .acts{display:flex;gap:6px;flex-wrap:wrap}
.al.late{border-color:var(--warn)}
.setnote{font-size:.85rem;color:var(--muted);margin:0}
.statusbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px dashed var(--gold2);padding:10px 14px;margin-bottom:18px;font-size:.88rem;color:var(--muted)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:700px){.ov{align-items:center;padding:20px}}
.modal{background:var(--card);border:1px solid var(--gold2);width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:22px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px))}
.modal h2{margin-bottom:6px}
label{display:block;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:14px 0 6px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--fg);padding:11px;border-radius:0}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfoot{display:flex;gap:8px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
.status{font-size:.75rem;color:var(--muted);text-align:center;padding-top:20px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
var MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var SEM=["dom","seg","ter","qua","qui","sex","sáb"], SEML=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
var DEFAULT_SERVICES=[{n:"Fio a fio",v:0},{n:"Volume russo",v:0},{n:"Volume brasileiro",v:0},{n:"Lash lifting",v:0},{n:"Manutenção",v:0},{n:"Remoção",v:0}];

var $=function(i){return document.getElementById(i)};
var pad=function(n){return String(n).padStart(2,"0")};
var key=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var pk=function(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2])};
var longD=function(k){var d=pk(k);return SEML[d.getDay()]+", "+d.getDate()+" de "+MESES[d.getMonth()]};
var money=function(n){return (+n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var newId=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};

var todayK=key(new Date());
var DEF={finance:true,services:DEFAULT_SERVICES,leadMin:30,briefing:"08:00",sound:true};
var S={appts:{},tasks:{},fin:{},settings:Object.assign({},DEF)};
var view="hoje",selDay=todayK,calMonth=new Date().getFullYear()*12+new Date().getMonth(),finMonth=calMonth,curMonth=calMonth;

/* ---------- armazenamento: banco compartilhado, ou este aparelho se não houver ---------- */
var db=null,local=false,COLS=["appts","tasks","fin"],loaded=true,got={};
var LS="agenda-jennifer-v1";
function lsLoad(){try{var v=JSON.parse(localStorage.getItem(LS)||"null");if(v){S.appts=v.appts||{};S.tasks=v.tasks||{};S.fin=v.fin||{};S.settings=Object.assign({},DEF,v.settings||{})}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function merge(a,b){var o=Object.assign({},a);Object.keys(b).forEach(function(k){var v=b[k];o[k]=(v&&typeof v==="object"&&!Array.isArray(v)&&o[k]&&typeof o[k]==="object")?merge(o[k],v):v});return o}
function put(col,id,data){
  if(col==="settings"){S.settings=data;}else{S[col][id]=data}
  render();
  if(db){db.doc(col+"/"+id).set(data).catch(onWriteErr)}else lsSave();
}
function patch(col,id,p){
  var cur=S[col][id];if(!cur)return;var nx=merge(cur,p);S[col][id]=nx;render();
  if(db){db.doc(col+"/"+id).update(p).catch(onWriteErr)}else lsSave();
}
function del(col,id){delete S[col][id];render();if(db){db.doc(col+"/"+id).delete().catch(onWriteErr)}else lsSave()}
function saveSettings(p){S.settings=merge(S.settings,p);if(p.services)S.settings.services=p.services;render();if(db){db.doc("settings/main").set(S.settings).catch(onWriteErr)}else lsSave()}
function onWriteErr(){$("status").textContent="Não foi possível salvar na nuvem. Confira se você abriu como dona da página."}

/* ---------- consultas ---------- */
function arr(col){return Object.keys(S[col]).map(function(id){var v=Object.assign({},S[col][id]);v.id=id;return v})}
function tasksOn(k){return arr("tasks").filter(function(t){return t.repeat==="daily"?(t.date<=k):t.date===k})}
function taskDone(t,k){return t.repeat==="daily"?!!(t.doneDates&&t.doneDates[k]):!!t.done}
function apptsOn(k){return arr("appts").filter(function(a){return a.date===k})}
function byTime(a,b){var x=a.time||"99:99",y=b.time||"99:99";return x<y?-1:x>y?1:0}
function dayItems(k){
  var it=[];
  apptsOn(k).forEach(function(a){it.push({kind:"a",d:a,time:a.time})});
  tasksOn(k).forEach(function(t){it.push({kind:"t",d:t,time:t.time})});
  return it.sort(byTime);
}
function countOn(k){return apptsOn(k).filter(function(a){return a.status!=="cancelado"}).length+tasksOn(k).length}
function financeOn(){return S.settings.finance!==false}
function monthRange(m){var y=Math.floor(m/12),mo=m%12;return {y:y,mo:mo,from:y+"-"+pad(mo+1)+"-01",to:y+"-"+pad(mo+1)+"-31",days:new Date(y,mo+1,0).getDate()}}
function monthFin(m){
  var r=monthRange(m),inn=0,out=0,prev=0,series=[],rows=[];
  for(var i=0;i<r.days;i++)series.push(0);
  arr("appts").forEach(function(a){
    if(a.date<r.from||a.date>r.to)return;
    var v=+a.value||0;
    if(a.status==="concluído"){inn+=v;series[+a.date.slice(8)-1]+=v;rows.push({date:a.date,desc:(a.client||"Cliente")+" · "+(a.service||"Atendimento"),v:v,type:"in",src:"a",id:a.id})}
    else if(a.status!=="cancelado")prev+=v;
  });
  arr("fin").forEach(function(f){
    if(f.date<r.from||f.date>r.to)return;
    var v=+f.value||0;
    if(f.type==="out")out+=v;else{inn+=v;series[+f.date.slice(8)-1]+=v}
    rows.push({date:f.date,desc:f.desc,v:v,type:f.type==="out"?"out":"in",src:"f",id:f.id});
  });
  rows.sort(function(a,b){return a.date<b.date?1:-1});
  return {r:r,inn:inn,out:out,prev:prev,series:series,rows:rows};
}

/* ---------- modal ---------- */
function openModal(title,body,onSave,extraFoot){
  var root=$("modalRoot");
  root.innerHTML='<div class="ov" id="ov"><form class="modal" id="mf"><h2>'+title+'</h2>'+body+'<div class="mfoot"><button type="button" class="btn ghost" id="mx">Cancelar</button>'+(extraFoot||"")+'<button type="submit" class="btn">Salvar</button></div></form></div>';
  var close=function(){root.innerHTML=""};
  $("mx").onclick=close;
  $("ov").addEventListener("mousedown",function(e){if(e.target.id==="ov")close()});
  $("mf").addEventListener("submit",function(e){e.preventDefault();onSave(new FormData($("mf")));close()});
  var f=$("mf").querySelector("input,select,textarea");if(f)f.focus();
  return close;
}
function serviceOptions(sel){return S.settings.services.map(function(s){return '<option value="'+esc(s.n)+'"'+(sel===s.n?" selected":"")+'>'+esc(s.n)+'</option>'}).join("")}
var LEADS=[[0,"No horário"],[10,"10 min antes"],[30,"30 min antes"],[60,"1 hora antes"],[120,"2 horas antes"]];
function leadSelect(cur){return '<select name="lead">'+LEADS.map(function(l){return '<option value="'+l[0]+'"'+(+cur===l[0]?" selected":"")+'>'+l[1]+'</option>'}).join("")+'</select>'}
function gStamp(k,t,addMin){var d=pk(k);if(t){var p=t.split(":");d.setHours(+p[0],+p[1]+(addMin||0),0)}return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+(t?"T"+pad(d.getHours())+pad(d.getMinutes())+"00":"")}
function gcalUrl(kind,d){
  var title=kind==="a"?((d.service||"Atendimento")+" · "+(d.client||"")):d.text;
  var det=kind==="a"?[d.phone?"WhatsApp: "+d.phone:"",d.note||""].filter(Boolean).join("\n"):"";
  var dates;
  if(d.time)dates=gStamp(d.date,d.time,0)+"/"+gStamp(d.date,d.time,kind==="a"?60:15);
  else{var n=pk(d.date);n.setDate(n.getDate()+1);dates=gStamp(d.date)+"/"+gStamp(key(n))}
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(title)+"&dates="+dates+"&details="+encodeURIComponent(det)+"&ctz=America%2FFortaleza"+(d.repeat==="daily"?"&recur="+encodeURIComponent("RRULE:FREQ=DAILY"):"");
}
var savedTimer=null;
function showSaved(kind,d){
  var el=$("saved");if(!el)return;
  el.innerHTML='<div class="saved"><span>'+(kind==="a"?"Atendimento salvo no site.":"Lembrete salvo no site.")+'</span><div class="btns"><a class="btn sm" id="gsave" target="_blank" rel="noopener" href="'+gcalUrl(kind,d)+'">Salvar no Google Agenda</a><button class="btn ghost sm" data-act="closesaved">Fechar</button></div></div>';
  clearTimeout(savedTimer);savedTimer=setTimeout(function(){el.innerHTML=""},60000);
}
function gBtn(kind,d){return '<a class="btn ghost" id="gcal" target="_blank" rel="noopener" href="'+gcalUrl(kind,d)+'">Google Agenda</a>'}
function apptForm(a){
  a=a||{};var isNew=!a.id,fin=financeOn();
  var body='<div class="two"><div><label>Data</label><input type="date" name="date" required value="'+esc(a.date||selDay)+'"></div><div><label>Horário</label><input type="time" name="time" required value="'+esc(a.time||"")+'"></div></div>'+
   '<label>Cliente</label><input name="client" required maxlength="60" value="'+esc(a.client)+'">'+
   '<label>WhatsApp</label><input name="phone" inputmode="tel" maxlength="20" value="'+esc(a.phone)+'">'+
   '<label>Serviço</label><select name="service" id="svcSel"><option value="">Escolher…</option>'+serviceOptions(a.service)+'</select>'+
   (fin?'<label>Valor (R$)</label><input name="value" id="valIn" type="number" step="0.01" min="0" value="'+(a.value!=null?esc(a.value):"")+'">':"")+
   '<label>Situação</label><select name="status"><option'+((a.status||"agendado")==="agendado"?" selected":"")+'>agendado</option><option'+(a.status==="concluído"?" selected":"")+'>concluído</option><option'+(a.status==="cancelado"?" selected":"")+'>cancelado</option></select>'+
   '<label>Avisar</label>'+leadSelect(a.lead!=null?a.lead:S.settings.leadMin)+
   '<label>Observações</label><textarea name="note" rows="2" maxlength="200">'+esc(a.note)+'</textarea>';
  var foot=isNew?"":gBtn("a",a)+'<button type="button" class="btn ghost" id="mdel">Excluir</button>';
  var close=openModal(isNew?"Novo atendimento":"Atendimento",body,function(f){
    var rec={date:f.get("date"),time:f.get("time"),client:f.get("client").trim(),phone:(f.get("phone")||"").trim(),service:f.get("service"),value:fin?(+f.get("value")||0):(a.value||0),status:f.get("status"),lead:+f.get("lead")||0,note:(f.get("note")||"").trim()};
    put("appts",a.id||newId(),rec);selDay=rec.date;if(isNew)showSaved("a",rec);

var AL="agenda-jennifer-alerts-v1",alertSt={day:"",dismissed:{},snoozed:{}},announced={},tests=[],audioCtx=null;
function alLoad(){try{var v=JSON.parse(localStorage.getItem(AL)||"null");alertSt=(v&&v.day===todayK)?v:{day:todayK,dismissed:{},snoozed:{}}}catch(e){alertSt={day:todayK,dismissed:{},snoozed:{}}}}
function alSave(){try{localStorage.setItem(AL,JSON.stringify(alertSt))}catch(e){}}
function toMin(t){var p=t.split(":");return (+p[0])*60+(+p[1])}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes()}
function dueAlerts(){
  var out=[],nm=nowMin(),now=Date.now();
  if(alertSt.day!==todayK)alLoad();
  tests.forEach(function(t){out.push(t)});
  var br=S.settings.briefing;
  if(loaded&&br&&nm>=toMin(br)){
    var bk="brief|"+todayK;
    if(!alertSt.dismissed[bk]){
      var ap=apptsOn(todayK).filter(function(a){return a.status!=="cancelado"}).sort(byTime),ts=tasksOn(todayK).filter(function(t){return !taskDone(t,todayK)});
      if(ap.length||ts.length)out.push({ak:bk,brief:true,title:"Resumo de hoje",sub:ap.length+(ap.length===1?" atendimento":" atendimentos")+(ap.length?" · o primeiro às "+ap[0].time:"")+" · "+ts.length+(ts.length===1?" lembrete":" lembretes")});
    }
  }
  dayItems(todayK).forEach(function(i){
    if(!i.time)return;var d=i.d;
    if(i.kind==="a"){if(d.status!=="agendado")return}else if(taskDone(d,todayK))return;
    var lead=(d.lead!=null&&d.lead!=="")?+d.lead:(i.kind==="a"?+S.settings.leadMin:0);
    var at=toMin(i.time),ak=i.kind+"|"+d.id+"|"+todayK;
    if(nm<at-lead||alertSt.dismissed[ak]||(alertSt.snoozed[ak]&&alertSt.snoozed[ak]>now))return;
    var diff=at-nm;
    out.push({ak:ak,kind:i.kind,id:d.id,late:diff<0,title:i.kind==="a"?(d.service||"Atendimento")+" · "+(d.client||""):d.text,sub:(diff>0?"Começa em "+diff+" min":diff===0?"É agora":"Passou há "+(-diff)+" min")+" · "+i.time});
  });
  return out;
}
function renderAlerts(){
  var list=dueAlerts(),el=$("alerts");if(!el)return;
  el.innerHTML=list.map(function(a){
    var acts=a.test||a.brief?'<button class="btn sm" data-act="aloff" data-ak="'+esc(a.ak)+'">Dispensar</button>':
      '<button class="btn sm" data-act="aldone" data-ak="'+esc(a.ak)+'">Feito</button><button class="btn ghost sm" data-act="alsnz" data-ak="'+esc(a.ak)+'">Adiar 10 min</button><button class="btn ghost sm" data-act="aloff" data-ak="'+esc(a.ak)+'">Dispensar</button>';
    return '<div class="al'+(a.late?" late":"")+'" role="alert"><div class="m"><b>'+esc(a.title)+'</b><span>'+esc(a.sub)+'</span></div><div class="acts">'+acts+'</div></div>';
  }).join("");
  if(!loaded)return list;
  list.forEach(function(a){
    if(announced[a.ak])return;announced[a.ak]=true;
    beep();
    try{if(window.Notification&&Notification.permission==="granted")new Notification(a.title,{body:a.sub})}catch(e){}
    try{if(navigator.vibrate&&navigator.userActivation&&navigator.userActivation.hasBeenActive)navigator.vibrate([200,100,200])}catch(e){}
  });
  return list;
}
function unlockAudio(){try{if(!audioCtx){var C=window.AudioContext||window.webkitAudioContext;if(C)audioCtx=new C()}if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume()}catch(e){}}
function beep(){
  if(S.settings.sound===false||!audioCtx)return;
  try{[0,.28,.56].forEach(function(dt){var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+dt);o.stop(audioCtx.currentTime+dt+.18)})}catch(e){}
}
function alertStatusText(){
  var p=(window.Notification&&Notification.permission)||"indisponível";
  return "Som: "+(audioCtx?"liberado":"toque em Ativar para liberar")+" · Notificações do navegador: "+(p==="granted"?"ativadas":p==="denied"?"bloqueadas":p==="default"?"ainda não ativadas":"indisponíveis aqui");
}
function alertBar(){
  if(audioCtx)return "";
  return '<div class="statusbar"><span>Ative os alertas para ouvir o som quando um atendimento estiver chegando.</span><button class="btn sm" data-act="alon">Ativar alertas</button></div>';
}
function alertAction(act,ak){
  if(act==="aloff"){if(/^test/.test(ak))tests=tests.filter(function(t){return t.ak!==ak});else alertSt.dismissed[ak]=true}
  else if(act==="alsnz"){alertSt.snoozed[ak]=Date.now()+10*60000;delete announced[ak]}
  else if(act==="aldone"){
    var p=ak.split("|");
    if(p[0]==="a")patch("appts",p[1],{status:"concluído"});
    else{var t=S.tasks[p[1]];if(t){if(t.repeat==="daily"){var q={doneDates:{}};q.doneDates[todayK]=true;patch("tasks",p[1],q)}else patch("tasks",p[1],{done:true})}}
    alertSt.dismissed[ak]=true;
  }
  alSave();render();
}
document.addEventListener("click",function(e){
  unlockAudio();
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.dataset.act;
  if(a==="aloff"||a==="alsnz"||a==="aldone")alertAction(a,b.dataset.ak);
  else if(a==="alon"){unlockAudio();try{if(window.Notification&&Notification.permission==="default")Notification.requestPermission().then(render,render)}catch(x){}render()}
  else if(a==="altest"){unlockAudio();tests.push({ak:"test|"+Date.now(),test:true,title:"Teste de alerta",sub:"Se você viu este aviso, os alertas estão funcionando."});delete announced.x;render()}
  else if(a==="togsnd")saveSettings({sound:S.settings.sound===false});
  else if(a==="closesaved"){$("saved").innerHTML=""}
},true);
document.addEventListener("change",function(e){
  var el=e.target;if(!el.dataset||!el.dataset.set)return;
  if(el.dataset.set==="leadMin")saveSettings({leadMin:+el.value});
  if(el.dataset.set==="briefing")saveSettings({briefing:el.value||""});
});

/* atualização automática: vira o dia sozinho, mesmo com a página aberta */
function tick(){
  var k=key(new Date());
  if(k!==todayK){var wasSel=selDay===todayK;todayK=k;if(wasSel)selDay=k;var n=new Date(),nmo=n.getFullYear()*12+n.getMonth();if(finMonth===curMonth)finMonth=nmo;if(calMonth===curMonth)calMonth=nmo;curMonth=nmo;alLoad();render()}
  else renderAlerts();
}
setInterval(tick,15000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)tick()});

/* ---------- início ---------- */
lsLoad();alLoad();render();
if(window.claude&&claude.use){
  claude.use("db").then(function(d){
    if(!d)return;
    db=d;loaded=false;
    COLS.forEach(function(col){
      db.collection(col).onSnapshot(function(s){var o={};s.docs.forEach(function(x){o[x.id]=x.data()});S[col]=o;got[col]=true;if(got.appts&&got.tasks)loaded=true;render()},function(){loaded=true;render()});
    });
    db.doc("settings/main").onSnapshot(function(s){if(s.exists){var v=s.data();S.settings=Object.assign({},DEF,v)}render()},function(){});
    // leva para a nuvem o que já estava salvo neste aparelho
    try{var v=JSON.parse(localStorage.getItem(LS)||"null");
      if(v&&!localStorage.getItem(LS+"-synced")){COLS.forEach(function(c){Object.keys(v[c]||{}).forEach(function(id){db.doc(c+"/"+id).set(v[c][id]).catch(function(){})})});localStorage.setItem(LS+"-synced","1")}}catch(e){}
  });
}
})();
</script>
